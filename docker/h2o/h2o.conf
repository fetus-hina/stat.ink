user: h2o
pid-file: /run/h2o/h2o.pid
access-log: /dev/stdout
error-log: /dev/stderr

hosts:
  "localhost:80":
    listen:
      port: 80

    header.add:
      - "Cache-Control: no-transform"
      - "X-Content-Type-Options: nosniff"
      - "X-Frame-Options: SAMEORIGIN"

    paths:
      "/":
        file.dir: /home/statink/stat.ink/web
        file.index:
          - index.php
        redirect:
          url: /index.php/
          internal: yes
          status: 307

      "/assets/":
        file.dir: /home/statink/stat.ink/web/assets
        file.send-compressed: on
        expires: 14day

    file.custom-handler:
      extension: .php
      fastcgi.connect:
        port: /run/php-fpm/www.sock
        type: unix
