[www]
user = statink
; Keep the "apache" group, which owns the session and cache directories of the package
group = apache

listen = /run/php-fpm/www.sock
listen.owner = statink
listen.group = h2o
listen.mode = 0660

pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

slowlog = /var/log/php-fpm/www-slow.log

; clear_env drops PATH; /usr/local/bin holds node (see Dockerfile)
env[PATH] = /usr/local/bin:/usr/bin:/bin

; PHP errors go to the master's error log (the container's stdout) through
; the workers' stderr
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 13M

php_value[session.save_handler] = files
php_value[session.save_path] = /var/lib/php/session
php_value[soap.wsdl_cache_dir] = /var/lib/php/wsdlcache
